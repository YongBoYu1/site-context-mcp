[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "site-context-mcp"
version = "0.1.0"
description = "stdio MCP server: fetch/cache public llms.txt + site pages and return tool answers with source URLs."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
  { name = "YongBo Yu", email = "yongbo9852@gmail.com" },
]
keywords = ["mcp", "site-context", "yongbo-yu", "stdio"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "mcp>=1.9,<2",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://yongbo-yu.vercel.app"
Repository = "https://github.com/YongBoYu1/site-context-mcp"
"KiloDock" = "https://yongbo-yu.vercel.app/projects/kilodock"
"llms.txt" = "https://yongbo-yu.vercel.app/llms.txt"

[project.scripts]
site-context-mcp = "site_context_mcp.server:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/site_context_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/site_context_mcp", "README.md", "LICENSE", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
